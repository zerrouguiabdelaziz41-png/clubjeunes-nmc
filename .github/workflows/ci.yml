name: NMC CI

on:
  push:
    branches:
      - nmc-development
  pull_request:
    branches:
      - nmc-development

permissions:
  contents: read

concurrency:
  group: nmc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run lint

      - name: Build production assets
        run: npm run build
